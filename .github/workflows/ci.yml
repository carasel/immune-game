# Runs the same checks as `npm run verify` (types, tests, build) on every push
# and pull request, so a broken main shows up on GitHub rather than on the next
# person's machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
