<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Immune</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        overflow: hidden;
      }
      /* Phaser scales the canvas to FIT this element, so it needs a real size
         of its own — otherwise it sizes to the canvas and nothing ever fits. */
      #game {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
